name: Release — Production

on:
  push:
    branches:
      - production

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/senvada/pkl-next-fe

jobs:

  build:

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6

        with:
          context: .

          target: production

          push: true

          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.API_URL }}
  
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Verify Network
        run: |
          tailscale status
          ping -c 4 \
          ${{ secrets.PRODUCTION_HOST }}

      - name: Trigger Deploy via SEHooks
        run: |
          curl -s -X POST http://${{ secrets.PRODUCTION_HOST }}:8080/webhook/958355ae4e55ff5aa5eefef2ca4ba615937f72fdb258a215