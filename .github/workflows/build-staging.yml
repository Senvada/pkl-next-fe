name: Release — Staging

on:
  push:
    branches:
      - staging

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/senvada/pkl-next-fe

concurrency:
  group: release-staging
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: staging
          push: true
          tags: |
            ${{ env.IMAGE }}:staging
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.API_URL }}
      - name: Summary
        run: |
          echo "Image published:"
          echo "${{ env.IMAGE }}:staging"
          echo "${{ env.IMAGE }}:${{ github.sha }}"